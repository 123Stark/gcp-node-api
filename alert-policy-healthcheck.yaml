displayName: gcp-node-api-health-check-failed
combiner: OR
conditions:
  - displayName: Health check attempt failed
    conditionMatchedLog:
      filter: >
        resource.type="cloud_scheduler_job"
        resource.labels.job_id="health-check-job"
        jsonPayload.@type="type.googleapis.com/google.cloud.scheduler.logging.AttemptFinished"
        NOT httpRequest.status=200
notificationChannels:
  - projects/clrun-node/notificationChannels/14960580528631594120
alertStrategy:
  notificationRateLimit:
    period: 300s
