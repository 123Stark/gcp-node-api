steps:
  # ШАГ 1: Сборка образа миграций
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile.migrations', '-t', 'europe-west1-docker.pkg.dev/clrun-node/api-repo/migrations:$COMMIT_SHA', '.']
    id: 'build-migrations'

  # ШАГ 2: Публикация образа миграций
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/clrun-node/api-repo/migrations:$COMMIT_SHA']
    id: 'push-migrations'

  # ШАГ 3: Обновляем Job новым образом миграций
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'run-migrations'
      - '--image=europe-west1-docker.pkg.dev/clrun-node/api-repo/migrations:$COMMIT_SHA'
      - '--region=europe-west1'
    id: 'update-migrations-job'
    waitFor: ['push-migrations']

  # ШАГ 4: Запуск миграций через Cloud Run Job (уже с актуальным образом)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'run-migrations'
      - '--region=europe-west1'
      - '--wait'
    id: 'run-migrations'
    waitFor: ['update-migrations-job']

  # ШАГ 5: Сборка основного образа API
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/clrun-node/api-repo/gcp-node-api:$COMMIT_SHA', '.']
    id: 'build-app'

  # ШАГ 6: Публикация образа API
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/clrun-node/api-repo/gcp-node-api:$COMMIT_SHA']
    id: 'push-app'

  # ШАГ 7: Деплой на Cloud Run (только после успешных миграций)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gcp-node-api'
      - '--image'
      - 'europe-west1-docker.pkg.dev/clrun-node/api-repo/gcp-node-api:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=clrun-node:europe-west1:my-api-db'
      - '--set-env-vars=DB_SOCKET_PATH=/cloudsql/clrun-node:europe-west1:my-api-db,DB_USER=postgres,DB_NAME=tasksdb,NOTIFY_EMAIL=karpecivan304@gmail.com'
      - '--set-secrets=DB_PASSWORD=db-password:latest,RESEND_API_KEY=resend-api-key:latest'
    id: 'deploy'
    waitFor: ['run-migrations', 'push-app']

images:
  - 'europe-west1-docker.pkg.dev/clrun-node/api-repo/migrations:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/clrun-node/api-repo/gcp-node-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: 'projects/clrun-node/serviceAccounts/cloud-run-deployer@clrun-node.iam.gserviceaccount.com'