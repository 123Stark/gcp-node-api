displayName: gcp-node-api-errors
combiner: OR
conditions:
  - displayName: Error logs in gcp-node-api
    conditionMatchedLog:
      filter: >
        resource.type="cloud_run_revision"
        resource.labels.service_name="gcp-node-api"
        severity=ERROR
notificationChannels:
  - projects/clrun-node/notificationChannels/14960580528631594120
alertStrategy:
  notificationRateLimit:
    period: 300s